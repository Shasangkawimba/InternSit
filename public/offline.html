<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0F14" />
    <meta name="robots" content="noindex" />
    <title>Offline · InternSit</title>
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
    <style>
      :root { --bg: #FFFFFF; --card: #FFFFFF; --text: #111827; --muted: #4B5563; --line: #E5E7EB; --primary: #111827; --on-primary: #FFFFFF; }
      .dark { --bg: #0B0F14; --card: #0E131A; --text: #E2E8F0; --muted: #B0BEC5; --line: #334155; --primary: #E2E8F0; --on-primary: #0F172A; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1rem; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 24rem; padding: 1.5rem; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 0.75rem; }
      img { width: 3rem; height: 3rem; border-radius: 9999px; }
      h1 { margin: 1rem 0 0.5rem; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 0.875rem; line-height: 1.5; color: var(--muted); }
      button { margin-top: 1.25rem; padding: 0.5rem 1rem; font: inherit; font-size: 0.875rem; font-weight: 500; color: var(--on-primary); background: var(--primary); border: 0; border-radius: 0.5rem; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" width="48" height="48" />
      <h1>You're offline</h1>
      <p>InternSit needs a connection to load your applications. Your data is safe. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
